<div class="container"><div class="breadcrumb"><a href="/notes.html">探店笔记</a><span>/</span><span>体验分享</span></div><state-box :loading="loading" :error="error" @retry="init"></state-box><article v-if="blog&&!loading&&!error" class="article"><img v-if="images.length" class="article-cover" :src="image(images[0])" :alt="blog.title" @error="imageError"><span class="eyebrow">A STORY WORTH SHARING</span><h1 class="article-title">{{blog.title}}</h1><div class="article-author"><a :href="'/other-info.html?id='+blog.userId"><img class="avatar" :src="image(blog.icon,'/assets/avatar.svg')" alt="" @error="imageError"></a><div><a :href="'/other-info.html?id='+blog.userId"><b>{{blog.name || '探店用户'}}</b></a><p class="tiny muted">{{date(blog.createTime)}}</p></div><button v-if="!user||user.id!==blog.userId" class="btn small subtle" @click="toggleFollow" :disabled="followBusy">{{followed?'已关注':'+ 关注作者'}}</button></div><p class="article-content">{{plain(blog.content)}}</p><div class="article-images" v-if="images.length>1"><img v-for="(src,i) in images.slice(1)" :key="i" :src="image(src)" :alt="'探店照片'+(i+2)" loading="lazy" @error="imageError"></div><a v-if="shop" class="quick-link" :href="'/shop-detail.html?id='+shop.id" style="margin-bottom:25px"><i-icon name="store"></i-icon><div><b>{{shop.name}}</b><span>{{shop.address}}</span></div><i-icon name="arrow"></i-icon></a><div class="interaction-bar"><button class="btn subtle" :class="{active:blog.isLike}" @click="toggleLike" :disabled="likeBusy"><i-icon name="heart"></i-icon>{{blog.isLike?'已喜欢':'喜欢'}} {{blog.liked || 0}}</button><a class="btn subtle" href="#comments"><i-icon name="message"></i-icon>评论 {{commentTotal}}</a><div class="like-avatars"><img v-for="liker in likes" :key="liker.id" :src="image(liker.icon,'/assets/avatar.svg')" :alt="liker.nickName" @error="imageError"></div></div><section id="comments"><div class="section-head"><h2>聊聊这次体验</h2><span class="tiny muted">{{commentTotal}} 条评论</span></div><state-box :loading="commentsLoading&&!comments.length" :error="commentError" :empty="!commentsLoading&&!commentError&&!comments.length" label="还没有评论，说说你的想法吧" @retry="loadComments(!comments.length)"></state-box><div v-for="comment in comments" :key="comment.id" class="comment"><img :src="image(comment.authorIcon,'/assets/avatar.svg')" alt="" @error="imageError"><div><div class="comment-head"><b>{{comment.authorName || '探店用户'}}</b><span class="muted">{{date(comment.createTime)}}</span></div><p>{{comment.content}}</p></div></div><div v-if="comments.length<commentTotal" class="load-more"><button class="btn subtle small" @click="loadComments(false)" :disabled="commentsLoading">更多评论</button></div><form class="comment-box" @submit.prevent="submit"><label class="form-field"><span>分享你的看法</span><textarea v-model="text" maxlength="255" rows="3" placeholder="友善交流，让分享更有温度。" required></textarea></label><button class="btn" :disabled="busy||!text.trim()">{{busy?'发布中…':'发布评论'}}</button></form></section></article></div>
