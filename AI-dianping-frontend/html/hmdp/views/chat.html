<div class="container chat-layout"><div class="page-head"><div><span class="eyebrow">ASK, EXPLORE, CREATE</span><h1>你的城市生活助手</h1><p>找店铺、查优惠，也可以聊聊下一次出发的灵感。</p></div></div><section class="chat-panel"><header class="chat-head"><i-icon name="spark"></i-icon><div><h3>探见 AI 助手</h3><p class="tiny muted">了解店铺，也记得这段对话</p></div><button class="btn small subtle" @click="reset" :disabled="sending"><i-icon name="plus"></i-icon>新对话</button></header><div ref="messages" class="chat-messages" aria-live="polite"><div v-if="!messages.length" class="chat-welcome"><span class="eyebrow">HELLO, EXPLORER</span><h2>今天，有什么想发现的？</h2><p>告诉我你想找的店铺，或让我帮你看看预约与订单。</p><div class="suggestions"><button @click="suggest('帮我查看我的预约')">查看我的预约</button><button @click="suggest('帮我查看我的优惠订单')">查看优惠订单</button><button @click="suggest('有哪些可用的 AI 创作技能？')">寻找创作灵感</button></div></div><div v-for="(message,i) in messages" :key="i" class="chat-row" :class="{mine:message.role==='user'}"><span class="chat-avatar"><i-icon :name="message.role==='user'?'user':'spark'"></i-icon></span><div class="chat-bubble"><span v-if="sending&&i===messages.length-1&&!message.content" class="spinner"></span>{{message.content}}</div></div></div><form class="chat-compose" @submit.prevent="send"><textarea ref="input" v-model="text" rows="2" maxlength="2000" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行" aria-label="对话内容" @keydown.enter.exact.prevent="keySend"></textarea><button v-if="sending" class="btn subtle" type="button" @click="stop">停止回答</button><button v-else class="btn" :disabled="!text.trim()" type="submit"><i-icon name="arrow"></i-icon>发送</button></form></section><p class="form-help" style="text-align:center;margin-top:15px">AI 回答可能存在偏差，预约与优惠状态请以业务页面为准。请勿输入敏感信息。</p></div>
