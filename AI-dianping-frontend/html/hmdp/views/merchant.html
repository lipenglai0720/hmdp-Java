<div class="container"><div class="page-head"><div><span class="eyebrow">MAKE GOOD BUSINESS HAPPEN</span><h1>商家工作台</h1><p>打理店铺、发布优惠，让每一次到店都值得期待。</p></div><a class="btn subtle" href="/reservations.html">管理预约 <i-icon name="calendar"></i-icon></a></div><state-box :loading="loading" :error="error" :empty="!loading&&!error&&!shops.length" label="当前账号尚未绑定店铺，请联系管理员完成商家授权" @retry="init"></state-box><template v-if="shops.length&&!loading&&!error"><div class="filter-bar"><span class="muted tiny">当前管理店铺</span><select class="input" style="max-width:360px;flex:1" v-model="selectedId" @change="selectShop" :disabled="busy"><option v-for="shop in shops" :key="shop.id" :value="shop.id">{{shop.name}}</option></select><a class="text-link" :href="'/shop-detail.html?id='+selectedId">查看店铺页面 <i-icon name="arrow"></i-icon></a></div><div class="tabs"><button :class="{active:tab==='shop'}" @click="tab='shop'">店铺资料</button><button :class="{active:tab==='coupon'}" @click="tab='coupon'">发布优惠</button><button :class="{active:tab==='list'}" @click="tab='list'">已发布优惠</button></div>
<form v-if="tab==='shop'" class="card padded" @submit.prevent="saveShop"><div class="two-col equal"><div><label class="form-field"><span>店铺名称</span><input v-model="shopForm.name" maxlength="128" required></label><div class="form-row"><label class="form-field"><span>所在商圈</span><input v-model="shopForm.area" maxlength="128"></label><label class="form-field"><span>人均消费 / 元</span><input v-model="shopForm.avgPrice" type="number" min="0" max="1000000"></label></div><label class="form-field"><span>详细地址</span><input v-model="shopForm.address" maxlength="255" required></label><label class="form-field"><span>营业时间</span><input v-model="shopForm.openHours" maxlength="32" placeholder="例如 10:00 - 22:00"></label></div><div><div class="form-row"><label class="form-field"><span>经度</span><input v-model="shopForm.x" type="number" step="any" min="-180" max="180"></label><label class="form-field"><span>纬度</span><input v-model="shopForm.y" type="number" step="any" min="-85.05112878" max="85.05112878"></label></div><label class="form-field"><span>店铺图片地址</span><textarea v-model="shopForm.images" maxlength="1024" rows="5" placeholder="多个图片地址用英文逗号分隔"></textarea></label><p class="form-help">请填写真实、可访问的店铺照片地址。图片预览失败时会展示平台默认配图。</p></div></div><button class="btn" :disabled="busy">{{busy?'保存中…':'保存店铺资料'}}</button></form>
<form v-else-if="tab==='coupon'" class="card padded" @submit.prevent="publish"><div class="two-col equal"><div><label class="form-field"><span>优惠类型</span><select v-model="voucherType"><option value="0">普通优惠券</option><option value="1">限时抢购券</option></select></label><label class="form-field"><span>优惠标题</span><input v-model="coupon.title" required maxlength="255" placeholder="清楚描述优惠内容"></label><label class="form-field"><span>优惠说明</span><input v-model="coupon.subTitle" maxlength="255"></label><label class="form-field"><span>使用规则</span><textarea v-model="coupon.rules" maxlength="1024" placeholder="适用范围、使用时段及其他条件"></textarea></label></div><div><div class="form-row"><label class="form-field"><span>优惠价格 / 元</span><input v-model="coupon.pay" type="number" step="0.01" min="0" required></label><label class="form-field"><span>券面价值 / 元</span><input v-model="coupon.face" type="number" step="0.01" min="0.01" required></label></div><template v-if="voucherType==='1'"><label class="form-field"><span>抢购库存</span><input v-model="coupon.stock" type="number" min="1" max="100000" required></label><label class="form-field"><span>开始时间</span><input v-model="coupon.begin" type="datetime-local" required></label><label class="form-field"><span>结束时间</span><input v-model="coupon.end" type="datetime-local" required></label></template><div class="notice">发布后向用户展示，每人每券限领一张。当前尚未开放在线支付与核销。</div><a class="text-link" :href="'/skills.html?skill=coupon_copy&shopName='+encodeURIComponent(shopForm.name)">让 AI 帮你写文案 <i-icon name="spark"></i-icon></a></div></div><button class="btn" :disabled="busy">{{busy?'发布中…':'发布优惠'}}</button></form>
<section v-else><state-box :loading="voucherLoading" :empty="!voucherLoading&&!vouchers.length" label="还没有发布优惠"></state-box><div v-for="v in vouchers" :key="v.id" class="coupon"><div class="coupon-price">¥<b>{{money(v.payValue)}}</b><small>¥{{money(v.actualValue)}}</small></div><div class="coupon-info"><span class="pill">{{Number(v.type)===1?'限时抢购':'普通优惠'}}</span><h3>{{v.title}}</h3><p>{{v.subTitle}}</p><p v-if="Number(v.type)===1">{{date(v.beginTime)}} — {{date(v.endTime)}} · 剩余 {{v.stock}} 张</p></div></div></section></template></div>
