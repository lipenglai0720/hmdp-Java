<div class="container"><div class="page-head"><div><span class="eyebrow">MAKE YOUR EXPERIENCE A STORY</span><h1>分享一次探店</h1><p>写下真实体验，给下一位出发的人一点参考。</p></div><a class="text-link" href="/skills.html">用 AI 整理灵感 <i-icon name="spark"></i-icon></a></div><div class="two-col"><form class="card padded" @submit.prevent="submit"><label class="form-field"><span>笔记标题</span><input v-model="title" placeholder="给这次体验取个名字" maxlength="255" required></label><div class="form-row"><label class="form-field"><span>查找关联店铺</span><input v-model="shopName" @input="searchShop" placeholder="输入店铺名称"></label><label class="form-field"><span>关联店铺</span><select v-model="shopId" required><option value="">请选择店铺</option><option v-if="shopId&&!shops.some(s=>String(s.id)===String(shopId))" :value="shopId">店铺 #{{shopId}}</option><option v-for="shop in shops" :value="shop.id" :key="shop.id">{{shop.name}}</option></select></label></div><label class="form-field"><span>探店正文</span><textarea v-model="content" placeholder="环境、服务、推荐单品、人均消费…分享你亲身经历的细节。" rows="12" maxlength="2048" required></textarea></label><span class="label">探店照片 · 最多9张</span><div class="upload-grid"><div v-for="(src,i) in images" :key="src" class="upload-image"><img :src="src" :alt="'照片'+(i+1)"><button type="button" @click="removeImage(i)" :disabled="busy||uploading" aria-label="移除照片"><i-icon name="close"></i-icon></button></div><label v-if="images.length<9" class="upload-button"><i-icon name="plus"></i-icon>{{uploading?'上传中…':'添加照片'}}<input type="file" accept="image/jpeg,image/png,image/webp" multiple :disabled="uploading||busy" @change="upload"></label></div><p class="form-help">支持 JPG、PNG、WebP，每张不超过10MB。</p><div v-if="error" class="notice error" role="alert">{{error}}</div><div class="form-actions"><button class="btn" :disabled="busy||uploading">{{busy?'发布中…':'发布笔记'}}</button><a class="btn subtle" href="/notes.html">返回笔记</a></div></form><aside class="card padded"><span class="eyebrow">A GOOD STORY STARTS WITH YOU</span><h2>真实，是最好的文案。</h2><p class="muted tiny" style="margin-top:18px">讲清楚你去了哪里、体验了什么。分享让你惊喜的地方，也可以客观写下有待改善的细节。</p><p class="muted tiny" style="margin-top:12px">若使用 AI 辅助创作，请核对实际体验后再发布，避免包含他人的隐私信息。</p></aside></div></div>
