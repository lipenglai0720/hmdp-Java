<div class="container login-layout"><div class="login-visual"><img src="/assets/images/coffee-story.png" alt="在城市里遇见舒适的角落"><div><span class="eyebrow" style="color:#dce4cb">YOUR NEXT LITTLE DISCOVERY</span><h2>每次出发，<br>都有新的喜欢。</h2><p>发现好店 · 记录生活 · 收藏灵感</p></div></div><form class="login-form" @submit.prevent="submit"><span class="eyebrow">WELCOME TO TANJIAN</span><h1>好久不见，欢迎回来。</h1><p>使用手机号登录，开启你的城市生活。</p><label class="form-field"><span>手机号码</span><input v-model.trim="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入11位手机号码" pattern="1[3-9][0-9]{9}" maxlength="11" required></label><label class="form-field"><span>验证码</span><div class="code-input"><input v-model.trim="code" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入6位验证码" pattern="[0-9]{6}" maxlength="6" required><button class="btn subtle" type="button" @click="sendCode" :disabled="sending||countdown>0">{{countdown?countdown+'秒后重试':sending?'发送中…':'获取验证码'}}</button></div></label><div class="notice">本地演示环境：验证码请在后端运行日志中查看。</div><label class="form-help" style="display:flex;align-items:center;gap:8px;margin-bottom:20px"><input v-model="agreed" type="checkbox" required>我已阅读并了解 <a class="text-link" href="/about.html" target="_blank" rel="noopener">平台使用说明</a></label><div v-if="error" class="notice error" role="alert">{{error}}</div><button class="btn full" type="submit" :disabled="busy">{{busy?'登录中…':'登录 / 注册'}} <i-icon name="arrow"></i-icon></button><p class="form-help" style="text-align:center;margin-top:18px">未注册的手机号验证后将自动创建账号。</p></form></div>
