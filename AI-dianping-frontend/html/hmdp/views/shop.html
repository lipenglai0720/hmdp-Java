<div class="container"><div class="breadcrumb"><a href="/index.html">发现</a><span>/</span><a href="/shop-list.html">城市好店</a><span>/</span><span>{{shop?shop.name:'店铺详情'}}</span></div><state-box :loading="loading" :error="error" @retry="init"></state-box><template v-if="shop&&!loading&&!error">
<div class="shop-gallery" :class="{single:images.length<2}"><img :src="image(images[0])" :alt="shop.name" @error="imageError"><img v-if="images.length>1" :src="image(images[1])" :alt="shop.name+'店内环境'" @error="imageError"></div>
<div class="two-col section"><div><div class="shop-info"><span class="eyebrow">{{shop.area || 'YOUR NEXT FAVORITE PLACE'}}</span><h1>{{shop.name}}</h1><div class="shop-meta"><span class="rating" v-if="shop.score"><i-icon name="star"></i-icon>{{(shop.score/10).toFixed(1)}}</span><span>人均 ¥{{shop.avgPrice || '—'}}</span><span>{{shop.comments || 0}} 条评价</span></div><div class="detail-line"><i-icon name="location"></i-icon>{{shop.address || '地址待补充'}}</div><div class="detail-line"><i-icon name="clock"></i-icon>{{shop.openHours || '营业时间请咨询商家'}}</div></div>
<section class="section"><div class="section-head"><h2>到店优惠</h2><span class="pill orange">每人每券限领一张</span></div><div v-if="orderNotice" class="notice">{{orderNotice}} <a href="/orders.html">查看订单 →</a></div><state-box :error="voucherError" :empty="!voucherError&&!vouchers.length" label="商家暂未发布优惠" @retry="loadVouchers"></state-box><div v-for="v in vouchers" :key="v.id" class="coupon"><div class="coupon-price">¥<b>{{money(v.payValue)}}</b><small>面值 ¥{{money(v.actualValue)}}</small></div><div class="coupon-info"><span v-if="Number(v.type)===1" class="pill orange">限时优惠</span><h3>{{v.title}}</h3><p>{{v.subTitle}}</p><p v-if="v.rules">{{v.rules}}</p><p v-if="Number(v.type)===1">{{date(v.beginTime)}} — {{date(v.endTime)}} · 剩余 {{v.stock}} 张</p></div><button class="btn small" :disabled="voucherBusy[v.id]||(Number(v.type)===1&&voucherLabel(v)!=='限时抢购')" @click="claim(v)">{{voucherBusy[v.id]?'提交中…':voucherLabel(v)}}</button></div><p v-if="vouchers.length" class="tiny muted">领取记录可在我的优惠订单查看；当前尚未开放在线支付和核销。</p></section>
<section class="section"><div class="section-head"><div><h2>大家的探店笔记</h2><p>{{noteTotal}} 篇关于这里的真实分享</p></div><a class="text-link" :href="'/blog-edit.html?shopId='+shop.id"><i-icon name="plus"></i-icon>写笔记</a></div><state-box :loading="notesLoading&&!blogs.length" :error="noteError" :empty="!notesLoading&&!noteError&&!blogs.length" label="还没有关于这家店的笔记，来分享你的体验吧" @retry="loadNotes(!blogs.length)"></state-box><div class="grid notes-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><note-card v-for="blog in blogs" :key="blog.id" :blog="blog"></note-card></div><div class="load-more" v-if="blogs.length<noteTotal"><button class="btn subtle" @click="loadNotes(false)" :disabled="notesLoading">查看更多笔记</button></div></section></div>
<aside class="sticky stack"><div class="booking-aside"><span class="eyebrow" style="color:#b6cba7">MAKE TIME FOR A GOOD TIME</span><h2>给好时光，留个位置。</h2><p>选好时间和同行人数，向商家提交到店预约，确认后安心出发。</p><a class="btn" :href="'/reservation.html?shopId='+shop.id"><i-icon name="calendar"></i-icon>预约到店</a><small>预约提交后，由商家确认。</small></div><a class="card padded" style="display:block" :href="'/skills.html?shopId='+shop.id+'&shopName='+encodeURIComponent(shop.name)"><i-icon name="spark"></i-icon><h3 style="margin-top:12px">给这次探店，一点灵感</h3><p class="tiny muted" style="margin:10px 0">让 AI 帮你整理体验，写出有温度的探店笔记。</p><span class="text-link">去创作 →</span></a></aside></div></template></div>
