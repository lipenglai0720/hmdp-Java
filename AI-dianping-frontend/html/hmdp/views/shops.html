<div class="container"><div class="page-head"><div><span class="eyebrow">FIND YOUR NEXT FAVORITE</span><h1>城市好店</h1><p>每一种生活方式，都有一个好去处。</p></div></div>
<form class="filter-bar" @submit.prevent="searchNow"><label class="search-input"><i-icon name="search"></i-icon><input v-model="name" placeholder="输入店铺名称" aria-label="店铺名称" maxlength="100"></label><button class="btn" type="submit">搜索店铺</button><button class="btn subtle" type="button" @click="locate" :disabled="locating"><i-icon name="location"></i-icon>{{locating?'定位中…':'查找附近'}}</button></form>
<div class="chips" aria-label="分类筛选"><button class="chip" :class="{active:!typeId}" @click="choose(0)">全部</button><button v-for="type in types" :key="type.id" class="chip" :class="{active:typeId===type.id}" @click="choose(type.id)">{{type.name}}</button></div>
<div v-if="x!==null" class="notice">已按当前位置筛选 5 公里内的店铺，距离仅供参考。<button class="text-button" @click="clearLocation">清除定位</button></div>
<state-box :loading="loading&&!shops.length" :error="error" :empty="!loading&&!error&&!shops.length" label="没有找到符合条件的店铺，换个关键词试试" @retry="fetch(!shops.length)"></state-box>
<div class="grid shops-grid"><shop-card v-for="shop in shops" :key="shop.id" :shop="shop"></shop-card></div><div v-if="shops.length" class="load-more"><button v-if="!done" class="btn subtle" @click="fetch(false)" :disabled="loading">{{loading?'加载中…':'查看更多店铺'}}</button><span v-else class="muted tiny">已经看完这些店铺啦</span></div></div>
