<div class="container"><div class="page-head"><div><span class="eyebrow">YOUR LIFE, YOUR STORIES</span><h1>{{own?'我的城市生活':'探店作者'}}</h1></div></div><state-box :loading="loading" :error="error" @retry="init"></state-box><template v-if="person&&!loading&&!error"><section class="card"><div class="profile-cover"></div><div class="profile-summary"><img class="avatar" :src="image(person.icon,'/assets/avatar.svg')" alt="" @error="imageError"><div class="profile-name"><h1>{{person.nickName}}</h1><p class="tiny muted">{{info.introduce || '认真生活，发现身边的小美好。'}}</p></div><div class="profile-actions" v-if="own"><button class="btn small" @click="sign" :disabled="busy||signCount>0"><i-icon name="check"></i-icon>{{signCount>0?'今日已签到':'每日签到'}}</button><a class="btn small subtle" href="/info-edit.html">账户资料</a></div><div class="profile-actions" v-else><button class="btn small" @click="follow" :disabled="busy">{{followed?'已关注':'+ 关注'}}</button><button class="btn small subtle" @click="loadCommon">共同关注</button></div></div><div class="stats"><div><b>{{info.followee || 0}}</b><span>关注</span></div><div><b>{{info.fans || 0}}</b><span>粉丝</span></div><div v-if="own"><b>{{signCount}}</b><span>连续签到 / 天</span></div></div></section>
<div v-if="own" class="quick-grid"><a class="quick-link" href="/orders.html"><i-icon name="ticket"></i-icon><div><b>我的优惠订单</b><span>查看领取和抢购结果</span></div></a><a class="quick-link" href="/reservations.html"><i-icon name="calendar"></i-icon><div><b>我的预约</b><span>管理即将到来的好时光</span></div></a><a class="quick-link" href="/notes.html?tab=follow"><i-icon name="heart"></i-icon><div><b>关注动态</b><span>看看喜欢的人去了哪</span></div></a><a class="quick-link" href="/skills.html"><i-icon name="spark"></i-icon><div><b>我的 AI 创作</b><span>让灵感成为好内容</span></div></a></div>
<section v-if="showCommon" class="section"><div class="section-head"><h2>我们共同关注的人</h2></div><state-box :loading="commonLoading" :empty="!commonLoading&&!common.length" label="暂时没有共同关注的作者"></state-box><div class="quick-grid"><a v-for="p in common" :key="p.id" class="quick-link" :href="'/other-info.html?id='+p.id"><img class="avatar" :src="image(p.icon,'/assets/avatar.svg')" alt=""><b>{{p.nickName}}</b></a></div></section>
<section class="section"><div class="section-head"><h2>{{own?'我的探店笔记':'TA 的探店笔记'}}</h2><a v-if="own" class="text-link" href="/blog-edit.html"><i-icon name="plus"></i-icon>写一篇笔记</a></div><state-box :empty="!blogs.length" label="还没有探店笔记"></state-box><div class="grid notes-grid"><note-card v-for="b in blogs" :key="b.id" :blog="b"></note-card></div><div class="load-more" v-if="blogs.length&&!done"><button class="btn subtle" @click="moreNotes" :disabled="busy">加载更多</button></div></section></template></div>
