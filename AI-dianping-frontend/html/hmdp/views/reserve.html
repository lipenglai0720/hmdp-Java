<div class="container"><div class="page-head"><div><span class="eyebrow">SAVE A SPOT FOR SOMETHING GOOD</span><h1>预约到店</h1><p>为下一次见面，安排一个好时间。</p></div></div><state-box :loading="loading" @retry="init"></state-box><div v-if="successId" class="card padded" style="max-width:750px;margin:auto;text-align:center;padding:55px 25px"><i-icon name="check" style="width:50px;height:50px;color:#326659"></i-icon><h2 style="margin:20px 0 10px">预约申请已提交</h2><p class="muted">请等待商家确认，你可以随时在预约管理中查看进度。</p><p class="tiny muted" style="margin-top:12px">预约编号 #{{successId}}</p><div class="form-actions" style="justify-content:center"><a class="btn" href="/reservations.html">查看我的预约</a><a class="btn subtle" :href="'/shop-detail.html?id='+shopId">返回店铺</a></div></div><div v-else-if="!loading" class="two-col"><form class="card padded" @submit.prevent="submit"><div v-if="error" class="notice error" role="alert">{{error}}</div><template v-if="shop"><h2 style="margin-bottom:24px">{{shop.name}}</h2><div class="form-row"><label class="form-field"><span>到店时间</span><input v-model="time" type="datetime-local" required></label><label class="form-field"><span>同行人数</span><input v-model="people" type="number" min="1" max="20" required></label></div><label class="form-field"><span>预约备注</span><textarea v-model="remark" placeholder="如有座位偏好或其他需求，可以告诉商家。" maxlength="255" rows="4"></textarea></label><div class="notice">预约提交后需商家确认。特殊需求请以商家实际确认结果为准。</div><button class="btn" :disabled="busy">{{busy?'提交中…':'提交预约申请'}}<i-icon name="arrow"></i-icon></button></template></form><aside v-if="shop" class="card padded"><img :src="image(shop.images)" :alt="shop.name" style="width:100%;height:180px;border-radius:12px;margin-bottom:20px" @error="imageError"><h3>{{shop.name}}</h3><div class="detail-line"><i-icon name="location"></i-icon>{{shop.address}}</div><div class="detail-line"><i-icon name="clock"></i-icon>{{shop.openHours || '营业时间请咨询商家'}}</div></aside></div></div>
