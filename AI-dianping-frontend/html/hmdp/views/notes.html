<div class="container"><div class="page-head"><div><span class="eyebrow">THE CITY, THROUGH YOUR EYES</span><h1>探店笔记</h1><p>认真记录，分享每一次值得的体验。</p></div><a class="btn" href="/blog-edit.html"><i-icon name="plus"></i-icon>发布笔记</a></div><div class="tabs"><button :class="{active:tab==='hot'}" @click="choose('hot')">热门发现</button><button :class="{active:tab==='follow'}" @click="choose('follow')">我的关注</button></div><div v-if="tab==='follow'" class="notice">这里会展示你关注作者的新动态。</div><state-box :loading="loading&&!blogs.length" :error="error" :empty="!loading&&!error&&!blogs.length" :label="tab==='follow'?'关注喜欢的作者，等待他们的下一次分享':'还没有探店分享，来写下第一篇吧'" @retry="fetch(!blogs.length)"></state-box><div class="grid notes-grid"><note-card v-for="blog in blogs" :key="blog.id" :blog="blog"></note-card></div><div v-if="blogs.length" class="load-more"><button class="btn subtle" v-if="!done" @click="fetch(false)" :disabled="loading">{{loading?'加载中…':'发现更多笔记'}}</button><span v-else class="muted tiny">已经看到最后啦</span></div></div>
